services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    command: pnpm dev
    depends_on:
      - api_service
    networks:
      - app-network

  api_service:
    build:
      context: ./backend/api_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/api_service:/app/api_service
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    command: uvicorn api_service.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/api_service/app
    networks:
      - app-network

  stt_service:
    build:
      context: ./backend/stt_service
      dockerfile: Dockerfile
    volumes:
      - ./backend/stt_service:/app/stt_service
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: python -m stt_service.app.main dev
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 